name: rent-room-auth
services:
  rent-room-auth:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [gateway]
networks:
  gateway:
    external: true
    name: model-server_default
