.topic{padding-bottom:4px}.inspection{padding:8px 0}.inspection .inspection{border-left:0;padding-left:12px}.group-content{padding-top:4px}
.binary,.result-control{border-radius:9px}.binary button{border-radius:7px}.toolbar{margin-bottom:4px}.context{margin-bottom:0}
.phase-pills button[aria-pressed=true]{background:var(--soft)}
.directory{padding-top:0}.directory-title{padding-left:0;margin-bottom:6px}.directory-list{gap:0}

function refreshGroupControls(){for(const g of groups().values()){const el=document.querySelector(`[data-group-section="${CSS.escape(g.id)}"]`);if(!el)continue;const status=groupStatus(g,house());el.querySelectorAll(':scope > .topic-heading [data-action=group-normal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.value===status));el.querySelectorAll(':scope > .topic-heading [data-action=group-result]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.value===groupResult(g,house())));}}
function openHouse(edit=false){editId=edit?house().id:null;$('house-dialog-title').textContent=edit?'编辑地址':'新建房源';$('house-address').value=edit?house().address:'';$('house-dialog').showModal();}
function openCustom(){$('custom-title').textContent='添加检查项';$('custom-label').textContent='检查项名称';$('custom-name').value='';$('custom-name').placeholder='例如：次卧空调制冷正常';$('custom-type-label').hidden=false;$('custom-dialog').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close){$(b.dataset.close).close();return;}if(b.dataset.view){view=b.dataset.view;query='';$('search').value='';filter='all';$('filter').value='all';render();return;}if(b.dataset.phase){phase=b.dataset.phase;render();return;}if(b.dataset.group){const g=groups().get(b.dataset.group);if(!g)return;const state=groupAnswer(house(),g.id);if(b.dataset.action==='fold-group'){house().groups||={};house().groups[g.id]={...state,expanded:b.getAttribute('aria-expanded')!=='true'};}else if(b.dataset.action==='group-not-applicable'){setGroupNotApplicable(house(),g,!groupSkipped(g,house()));}else if(b.dataset.action==='group-permission'){setGroupPermission(house(),g,b.dataset.value);}else if(['group-normal','group-result'].includes(b.dataset.action)){const selected=b.dataset.action==='group-normal'?(b.dataset.value==='是'?'正常':'有问题'):b.dataset.value;setGroupResult(house(),g,selected);if(groupResult(g,house())===selected&&selected!=='没有')notify(selected==='正常'?(groupFields(g,house()).length?'下方检查项已选“是”。':'已标记正常。'):'已标记有问题，下方选择保持不变。');}persist();render();return;}if(b.dataset.action==='calculate-commute'){calculateCommute(b.dataset.id,true);return;}if(b.dataset.action==='profile'){$('profile-open').click();return;}if(b.dataset.action==='choose'){const f=allTopics().flatMap(t=>t.fields).find(f=>f.id===b.dataset.id);if(!f)return;setField(f.id,'value',toggleChoiceValue(f,answer(f),b.dataset.value));if(view==='issues'||filter!=='all')render();return;}if(b.dataset.action==='flag'){setField(b.dataset.id,'problem',!house().answers[b.dataset.id]?.problem);render();return;}if(b.dataset.action==='decision'){house().decision=house().decision===b.dataset.value?'':b.dataset.value;persist();render();return;}if(b.dataset.action==='edit-house')openHouse(true);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.id&&el.dataset.prop){setField(el.dataset.id,el.dataset.prop,el.value);const f=allTopics().flatMap(t=>t.fields).find(f=>f.id===el.dataset.id);if(f?.role==='commute'&&el.dataset.prop==='value'){house().commute={...house().commute,source:'manual',signature:commuteSignature(house())};persist();}if(el.dataset.id==='f1_1'&&el.dataset.prop==='value')queueCommute();}if(el.id==='house-summary'){house().summary=el.value;persist();}});
$('new-house').onclick=()=>openHouse();$('edit-house').onclick=()=>openHouse(true);$('add-item').onclick=()=>openCustom();
$('house-switch').onchange=e=>{data.current=e.target.value;phase='all';view='check';filter='all';$('filter').value='all';query='';$('search').value='';persist();render();queueCommute();};
$('house-form').onsubmit=e=>{e.preventDefault();const address=$('house-address').value.trim();if(!address)return;const h=editId?house():fresh(address);h.address=address;h.answers.f1_1={...(h.answers.f1_1||{}),value:address};if(!editId){data.houses.push(h);data.current=h.id;phase='all';view='check';query='';$('search').value='';filter='all';$('filter').value='all';}persist();$('house-dialog').close();render();notify(editId?'地址已更新':'新房源已建立');queueCommute();};
$('custom-form').onsubmit=e=>{e.preventDefault();const label=$('custom-name').value.trim();if(!label)return;const id=uid(),type=$('custom-type').value;const t={id,title:label,phase:'现场看房',category:'自定义检查',hint:'按正常状态命名：是表示正常，否表示有问题。',fields:[{id:`${id}_0`,label,type,badValue:type==='y'?'否':undefined}]};house().extras.push(t);phase='all';query='';$('search').value='';persist();$('custom-dialog').close();render();notify('已添加，结果单独保存');};
$('search').oninput=e=>{query=e.target.value;render();};$('filter').onchange=e=>{filter=e.target.value;render();};
function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_').slice(0,60);}
$('export-open').onclick=()=>$('export-dialog').showModal();
$('download-backup').onclick=()=>{download(JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),`看房备份_${new Date().toLocaleDateString('sv-SE')}.json`,'application/json');notify('已导出全部房源备份');};
$('download-report').onclick=()=>{const h=house(),list=allFields(),chosen=list.filter(x=>recorded(x.field)||answer(x.field).note||answer(x.field).photo||problem(x.field));const report=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(h.address||h.name)} · 看房记录</title><style>body{font:16px/1.7 -apple-system,sans-serif;color:#1d1d1f;max-width:900px;margin:30px auto;padding:0 18px}h1{font-size:28px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #ddd;padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#f5f5f7}.bad{color:#a33838}small{color:#6e6e73}p{white-space:pre-wrap}@media(max-width:600px){table,tbody,tr,td{display:block}thead{display:none}tr{border:1px solid #ddd;margin:12px 0;border-radius:10px;padding:8px}td{border:0;padding:4px 8px}}.choice-compact .field-main{gap:12px}.choice-compact .field-response{width:auto;flex:0 0 auto}.choice-compact .choices{flex:none}.choice-compact .field-label{word-break:normal}
@media(max-width:600px){.choice-compact .field-main{gap:8px}.choice-compact .field-response{gap:0}}
</style><h1>${esc(h.address||h.name)}</h1><p>完整清单共 ${list.length} 个记录字段，已填写 ${list.filter(x=>recorded(x.field)).length} 个。有问题 ${list.filter(x=>problem(x.field)).length} 个。未填写的字段未视为已检查。</p><p>意向：${esc(h.decision||'暂未决定')}\n${esc(h.summary||'')}</p><table><thead><tr><th>检查项</th><th>结果</th><th>备注 / 照片</th></tr></thead><tbody>${chosen.map(({topic:t,field:f})=>{const a=answer(f);return `<tr><td><small>${esc(t.category)} / ${esc(t.title)}</small><br>${esc(f.label)}</td><td class="${problem(f)?'bad':''}">${esc(fieldDisplayValue(f,a)||'未选择')}${problem(f)?'<br>有问题':''}</td><td>${esc(a.note||'').replaceAll('\n','<br>')}${a.photo?'<br>照片：'+esc(a.photo):''}</td></tr>`;}).join('')}</tbody></table><p><small>导出时间：${esc(new Date().toLocaleString('zh-CN'))}</small></p></html>`;download(report,`${safeName(h.address||h.name)}_看房记录.html`,'text/html;charset=utf-8');notify('已导出房源报告');};
$('import-backup').onclick=()=>$('backup-file').click();
$('backup-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>15*1024*1024)throw Error('too large');const incoming=JSON.parse(await file.text());if(incoming.version!==1||!Array.isArray(incoming.houses)||!incoming.houses.length||incoming.houses.length>200||!incoming.houses.every(validHouse))throw Error('invalid');const added=incoming.houses.map(h=>migrateBehavior(normalizeHouse({...h,id:uid(),name:`${h.name}（导入）`},TOPICS),TOPICS));if(!data.profile.workplace&&incoming.profile)data.profile=incoming.profile;for(const h of added){if(h.address){h.name=(h.address||h.name)+'（导入）';h.answers.f1_1={...(h.answers.f1_1||{}),value:h.address};}}data.houses.push(...added);data.current=added[0].id;phase='all';query='';$('search').value='';filter='all';$('filter').value='all';view='check';persist();$('export-dialog').close();render();notify(`已导入 ${added.length} 套房源，原记录已保留`);}catch(err){notify('无法导入：请选择本清单导出的有效备份文件。');}e.target.value='';};
let commuteTimer;
function commuteSignature(h){return JSON.stringify([h.address,data.profile.workplace,data.profile.mode,data.profile.city]);}
function renderCommute(f){const h=house(),stale=h.commute?.signature&&h.commute.signature!==commuteSignature(h);return `<div class="commute-tools"><button data-action="calculate-commute" data-id="${esc(f.id)}"${commuteBusy.has(h.id)?' disabled':''}>${commuteBusy.has(h.id)?'计算中…':'自动计算'}</button><button class="link" data-action="profile">设置上班地点</button></div><p class="commute-note" role="status">${esc(commuteMessages[h.id]||(!data.profile.workplace?'先填写用户信息，也可以直接输入分钟数。':stale?'地址或用户信息已变更，请重新计算或手动修改。':h.commute?.source==='manual'?'手动填写':h.commute?.source==='amap'?'高德预计耗时 · 可手动修改':'可以自动计算，也可以手动填写。'))}</p>`;}
function queueCommute(){clearTimeout(commuteTimer);commuteTimer=setTimeout(()=>{const f=allTopics().flatMap(t=>t.fields).find(f=>f.role==='commute');if(f&&house().address&&data.profile.workplace)calculateCommute(f.id,false);},900);}
async function calculateCommute(fieldId,explicit=false){
 const h=house(),signature=commuteSignature(h);if(commuteBusy.has(h.id))return;
 if(!data.profile.workplace||!h.address){notify('请先填写房源地址和上班地点');return;}
 if(!explicit&&(h.commute?.signature===signature||h.commute?.source==='manual'))return;
 const before=String(h.answers[fieldId]?.value||'');commuteBusy.add(h.id);commuteMessages[h.id]='正在计算预计耗时…';render();
 try{const r=await fetch('/api/commute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:h.address,destination:data.profile.workplace,mode:data.profile.mode,city:data.profile.city}),signal:AbortSignal.timeout(20000)});const result=await r.json();if(!r.ok)throw Error(result.error||'自动计算暂不可用，请手动填写');
  if(!Number.isFinite(result.minutes)||result.minutes<0)throw Error('未取得有效耗时，请手动填写');
  if(commuteSignature(h)!==signature||String(h.answers[fieldId]?.value||'')!==before){commuteMessages[h.id]='信息已修改，本次计算结果未覆盖你的输入。';return;}
  h.answers[fieldId]={...(h.answers[fieldId]||{}),value:String(result.minutes)};h.commute={source:'amap',signature,calculatedAt:new Date().toISOString()};commuteMessages[h.id]='高德预计耗时 · 可手动修改';persist();
 }catch(err){commuteMessages[h.id]=String(err.message).includes('JSON')?'自动计算需要本地服务，请手动填写。':err.name==='TimeoutError'?'计算超时，请重试或手动填写。':err.message;}
 finally{commuteBusy.delete(h.id);if(h.id===data.current)render();}
}
$('profile-open').onclick=()=>{$('profile-workplace').value=data.profile.workplace||'';$('profile-mode').value=data.profile.mode||'transit';$('profile-city').value=data.profile.city||'';$('profile-dialog').showModal();};
$('profile-form').onsubmit=e=>{e.preventDefault();data.profile={workplace:$('profile-workplace').value.trim(),mode:$('profile-mode').value,city:$('profile-city').value.trim()};commuteMessages={};persist();$('profile-dialog').close();render();queueCommute();notify('用户信息已保存');};
function useBrain(next){
 const topics=toTopics(next);if(!validTopics(topics)||JSON.stringify(topics)===JSON.stringify(TOPICS))return;
 const resultMigration=data.houses.some(h=>needsResultMigration(h,topics));
 TOPICS=topics;data.houses.forEach(h=>migrateBehavior(normalizeHouse(h,TOPICS),TOPICS));if(resultMigration)persist();render();
 $('save-state').textContent='已同步最新脑图';
}
const sourceClient=createSourceClient(useBrain,(state,message)=>{if(state==='error')$('save-state').textContent='当前脑图已保留，尚未同步';},undefined,{initialTree:localBrain});
if(document.getElementById('checklist-data').dataset.custom!=='true'){
 sourceClient.refresh();
 window.addEventListener('focus',()=>sourceClient.refresh());
 window.addEventListener('storage',e=>{if(e.key==='rental-checklist-map-recovered-20261009'&&e.newValue){try{const saved=JSON.parse(e.newValue);if(validTree(saved.tree)){sourceClient.protectLocal(saved.tree);useBrain(saved.tree);}}catch{}}});
 setInterval(()=>{if(!document.hidden)sourceClient.refresh();},3000);
}
render();queueCommute();if(storageError)warn(storageError);else if(needsMigration)persist();else if(data.updatedAt)$('save-state').textContent='已恢复上次记录';
</script>
