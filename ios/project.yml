name: Xunju
fileGroups:
  - ci_scripts
options:
  bundleIdPrefix: com.keeline.xunju
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N3Z6DDSQCJ
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Xunju:
    type: application
    platform: iOS
    sources:
      - Xunju
      - path: ../apps/wechat/src/lib/wheel-fields.json
        buildPhase: resources
      - path: ../apps/wechat/src/assets/examples
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.keeline.xunju.ios
        PROVISIONING_PROFILE_SPECIFIER: "$(XUNJU_PROVISIONING_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Xunju/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 看房搭子
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄看房照片和视频，保存在本机房源记录中
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录制看房视频时收录现场声音
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 获取当前位置，用于识别货币类型、选择房源或上班地点。
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - package: ZIPFoundation
    postBuildScripts:
      - name: Localize isolated app name
        script: |
          /usr/bin/python3 -B "$SRCROOT/../scripts/ios-device/localize_copy_name.py" \
            --app "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --display-name "${XUNJU_ISOLATED_DISPLAY_NAME:-}"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../scripts/ios-device/localize_copy_name.py
          - $(SRCROOT)/Xunju/Resources/en.lproj/InfoPlist.strings
          - $(SRCROOT)/Xunju/Resources/zh-Hans.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/InfoPlist.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hans.lproj/InfoPlist.strings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hans.lproj
    entitlements:
      path: Xunju/Xunju.entitlements
      properties: {}
  XunjuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - XunjuTests
    dependencies:
      - target: Xunju
      - package: ZIPFoundation
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  XunjuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - XunjuUITests
    dependencies:
      - target: Xunju
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XunjuLiveUSSearch:
    build:
      targets:
        Xunju: [testing]
    test:
      config: Debug
      language: en-US
      region: US
      gatherCoverageData: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      targets:
        - name: XunjuUITests
          parallelizable: false
          selectedTests:
            - LivePlaceSearchTests/testEnglishUSAddressSearchAcrossStatesAndPersist()
  Xunju:
    build:
      targets:
        Xunju: all
    test:
      gatherCoverageData: false
      targets:
        - XunjuTests
        - XunjuUITests
  XunjuStoreKitTests:
    build:
      targets:
        Xunju: all
    run:
      storeKitConfiguration: XunjuTests/Fixtures/Capacity.storekit
    test:
      gatherCoverageData: false
      targets:
        - XunjuTests
  XunjuLaunch:
    build:
      targets:
        Xunju: all
    test:
      gatherCoverageData: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenRecording
      targets:
        - XunjuTests
        - XunjuUITests
