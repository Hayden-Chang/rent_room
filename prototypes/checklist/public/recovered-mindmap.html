用户信息\u003c/button>\u003c/div>\u003c/header>\n\u003cdiv class=\"warning\" id=\"storage-warning\" role=\"alert\" hidden>\u003c/div>\n\u003csection class=\"property\" aria-label=\"当前房源\">\u003cdiv class=\"property-caption\">\u003cp class=\"eyebrow\">当前房源\u003c/p>\u003cspan class=\"save-state\" id=\"save-state\" role=\"status\">尚未填写\u003c/span>\u003c/div>\u003cdiv class=\"property-line\">\u003cselect id=\"house-switch\" class=\"property-switch\" aria-label=\"切换房源\">\u003c/select>\u003cbutton id=\"new-house\" class=\"secondary\">＋ 新房源\u003c/button>\u003c/div>\u003cdiv class=\"property-info\">\u003cspan class=\"property-address\" id=\"property-address\">\u003c/span>\u003cbutton class=\"link small\" id=\"edit-house\">编辑地址\u003c/button>\u003c/div>\n\u003cdiv class=\"overview\">\u003cdiv class=\"stat\">\u003cdiv class=\"label\">已记录\u003c/div>\u003cdiv class=\"value\">\u003cspan id=\"recorded\">0\u003c/span> \u003csmall>/ \u003cspan id=\"total\">0\u003c/span>\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"stat problem\">\u003cdiv class=\"label\">有问题\u003c/div>\u003cdiv class=\"value\" id=\"issues-count\">0\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"label\">待检查\u003c/div>\u003cdiv class=\"value\" id=\"empty-count\">0\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"progress\" role=\"progressbar\" aria-label=\"检查进度\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\">\u003cdiv id=\"progress\" class=\"progress-bar\">\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"workspace\">\u003caside class=\"directory\" aria-label=\"清单目录\">\u003cp class=\"directory-title\">清单目录\u003c/p>\u003cnav id=\"category-nav\" class=\"directory-list\">\u003c/nav>\u003c/aside>\u003cdiv class=\"workspace-main\">\n\u003cdiv class=\"toolbar\">\u003cdiv class=\"search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"/>\u003cpath d=\"m16 16 5 5\"/>\u003c/svg>\u003cinput id=\"search\" type=\"search\" placeholder=\"搜索检查项\" aria-label=\"搜索检查项\">\u003c/div>\u003cselect id=\"filter\" aria-label=\"筛选记录\">\u003coption value=\"all\">全部记录\u003c/option>\u003coption value=\"empty\">未记录\u003c/option>\u003coption value=\"done\">已记录\u003c/option>\u003c/select>\u003cbutton class=\"category-open\" id=\"category-open\" aria-haspopup=\"dialog\" aria-label=\"清单目录\" title=\"清单目录\">\u003csvg aria-hidden=\"true\" viewBox=\"0 0 24 24\">\u003cpath d=\"M9 6h12M9 12h12M9 18h12M3 6h.1M3 12h.1M3 18h.1\"/>\u003c/svg>\u003cspan>目录\u003c/span>\u003c/button>\u003c/div>\n\u003cnav class=\"phase-pills\" id=\"phases\" aria-label=\"流程阶段\">\u003c/nav>\n\u003cdiv class=\"context\">\u003cbutton class=\"link small\" id=\"add-item\">＋ 自定义检查\u003c/button>\u003c/div>\n\u003cmain id=\"content\" class=\"sections\" tabindex=\"-1\">\u003c/main>\n\n\u003c/div>\u003c/div>\u003c/div>\n\u003cnav class=\"bottom-bar\" aria-label=\"主导航\">\u003cdiv class=\"bottom-inner\">\u003cdiv class=\"bottom-nav\">\u003cbutton data-view=\"check\" aria-pressed=\"true\">\u003csvg viewBox=\"0 0 24 24\">\u003crect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"3\"/>\u003cpath d=\"m8 9 2 2 4-4M8 16h8\"/>\u003c/svg>检查\u003c/button>\u003cbutton data-view=\"issues\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"m12 3 10 18H2Z\"/>\u003cpath d=\"M12 9v5m0 3v.2\"/>\u003c/svg>问题\u003cspan class=\"count\" id=\"nav-issue-count\" hidden>\u003c/span>\u003c/button>\u003cbutton data-view=\"conclusion\" aria-pressed=\"false\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M5 4h14v16H5Z\"/>\u003cpath d=\"M8 8h8m-8 4h8m-8 4h4\"/>\u003c/svg>总结\u003c/button>\u003c/div>\u003cbutton class=\"report-button\" id=\"export-open\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5\"/>\u003c/svg>报告与备份\u003c/button>\u003c/div>\u003c/nav>\n\u003cdialog id=\"category-dialog\" aria-labelledby=\"category-title\">\u003cdiv class=\"dialog-inner\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"category-title\">清单目录\u003c/h2>\u003cbutton data-close=\"category-dialog\" aria-label=\"关闭目录\">×\u003c/button>\u003c/div>\u003cnav id=\"category-menu\" class=\"directory-list\" aria-label=\"跳转分类\">\u003c/nav>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"house-dialog\">\u003cform id=\"house-form\" class=\"dialog-inner\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"house-dialog-title\">新建房源\u003c/h2>\u003cbutton type=\"button\" data-close=\"house-dialog\" aria-label=\"关闭\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-form\">\u003clabel>\u003cspan>地址\u003c/span>\u003cinput id=\"house-address\" required maxlength=\"300\" placeholder=\"小区、楼栋、房间号\">\u003c/label>\u003c/div>\u003cp class=\"dialog-copy\">户型、面积、顶楼、阳台、租金和朝向在清单最前面填写。\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" data-close=\"house-dialog\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">保存房源\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"custom-dialog\">\u003cform id=\"custom-form\" class=\"dialog-inner\">\u003cdiv class=\"dialog-head\">\u003ch2 id=\"custom-title\">添加检查项\u003c/h2>\u003cbutton type=\"button\" data-close=\"custom-dialog\" aria-label=\"关闭\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-form\">\u003clabel>\u003cspan id=\"custom-label\">检查项名称\u003c/span>\u003cinput id=\"custom-name\" required maxlength=\"100\" placeholder=\"例如：次卧空调制冷正常\">\u003c/label>\u003clabel id=\"custom-type-label\">\u003cspan>记录方式\u003c/span>\u003cselect id=\"custom-type\">\u003coption value=\"y\">是 / 否（是表示正常）\u003c/option>\u003coption value=\"t\">文字记录\u003c/option>\u003coption value=\"n\">数字记录\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" data-close=\"custom-dialog\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">添加\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"export-dialog\">\u003cdiv class=\"dialog-inner\">\u003cdiv class=\"dialog-head\">\u003ch2>报告与备份\u003c/h2>\u003cbutton data-close=\"export-dialog\" aria-label=\"关闭\">×\u003c/button>\u003c/div>\u003cp class=\"dialog-copy\">报告用于回看，备份文件可在另一台设备导入。旧版本删减前的记录也会保留在备份里。\u003c/p>\u003cdiv class=\"export-actions\">\u003cbutton id=\"download-report\">\u003cstrong>导出当前房源报告\u003c/strong>\u003cspan>已填写结果、问题、备注与照片编号\u003c/span>\u003c/button>\u003cbutton id=\"download-backup\">\u003cstrong>备份全部房源\u003c/strong>\u003cspan>下载可重新导入的 JSON 文件\u003c/span>\u003c/button>\u003cbutton id=\"import-backup\">\u003cstrong>导入备份\u003c/strong>\u003cspan>作为新房源加入，保留已有记录\u003c/span>\u003c/button>\u003c/div>\u003cinput type=\"file\" id=\"backup-file\" class=\"file-control\" accept=\".json,application/json\">\u003c/div>\u003c/dialog>\n\u003cdialog id=\"profile-dialog\">\u003cform id=\"profile-form\" class=\"dialog-inner\">\u003cdiv class=\"dialog-head\">\u003ch2>用户信息\u003c/h2>\u003cbutton type=\"button\" data-close=\"profile-dialog\" aria-label=\"关闭用户信息\">×\u003c/button>\u003c/div>\u003cdiv class=\"dialog-form\">\u003clabel>\u003cspan>上班地点\u003c/span>\u003cinput id=\"profile-workplace\" maxlength=\"300\" placeholder=\"城市、公司或办公楼地址\">\u003c/label>\u003clabel>\u003cspan>通勤方式\u003c/span>\u003cselect id=\"profile-mode\">\u003coption value=\"transit\">公交 / 地铁\u003c/option>\u003coption value=\"driving\">驾车\u003c/option>\u003coption value=\"walking\">步行\u003c/option>\u003coption value=\"bicycling\">骑行\u003c/option>\u003c/select>\u003c/label>\u003clabel>\u003cspan>所在城市\u003c/span>\u003cinput id=\"profile-city\" maxlength=\"100\" placeholder=\"例如：上海（帮助匹配地址）\">\u003c/label>\u003c/div>\u003cp class=\"dialog-copy\">用于计算各套房源到上班地点的预计耗时，结果可以手动修改。自动计算会把房源地址和上班地点发送给高德地图。\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton type=\"button\" data-close=\"profile-dialog\">取消\u003c/button>\u003cbutton type=\"submit\" class=\"primary\">保存信息\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript type=\"application/json\" id=\"checklist-data\" data-custom=\"false\">__CHECKLIST_DATA__\u003c/script>\n\u003cscript>\n'use strict';\nfunction canContain(parentKind,childKind) {\n  return parentKind==='root'?childKind==='group':parentKind==='group'?['group','field'].includes(childKind):parentKind==='field'?childKind==='option':false;\n}\nfunction fromTopics(topics) {\n  const root={id:'overview',kind:'root',title:'总览',children:[]};\n  const categories=[...new Set(topics.map(t=>t.category))];\n  for(const [i,category] of categories.entries()) {\n    const group={id:`category_${i}`,kind:'group',title:category,children:[]};\n    const list=topics.filter(t=>t.category===category);\n    for(const topic of list) {\n      const branch={id:`topic_${topic.id}`,kind:'group',title:topic.title,meta:{phase:topic.phase,hint:topic.hint,sources:topic.sources},children:[]};\n      for(const field of topic.fields) {\n        const {label,...meta}=field;\n        const node={id:field.id,kind:'field',title:label,meta:{...meta,phase:topic.phase,hint:topic.hint,sources:topic.sources},children:[]};\n        const options=field.type==='y'?['是','否']:field.type==='s'?field.options:[];\n        node.children=options.map((v,i)=>({id:`${field.id}_option_${i}`,kind:'option',title:v,children:[]}));\n        branch.children.push(node);\n      }\n      if(topic.title===category||list.length===1||topic.fields.length===1)group.children.push(...branch.children);\n      else group.children.push(branch);\n    }\n    root.children.push(group);\n  }\n  return root;\n}\nfunction indexTree(root) {\n  const map=new Map();\n  function walk(node,parent=null,depth=0){map.set(node.id,{node,parent,depth});for(const child of node.children)walk(child,node,depth+1);}\n  walk(root);return map;\n}\nfunction moveNode(root,id,targetId,mode='inside') {\n  if(!['inside','before','after'].includes(mode))return null;\n  const next=structuredClone(root),map=indexTree(next),source=map.get(id),target=map.get(targetId);\n  if(!source?.parent||!target||id===targetId)return null;\n  const parent=mode==='inside'?target.node:target.parent;\n  if(!parent||!canContain(parent.kind,source.node.kind))return null;\n  if(source.node.kind==='option'&&parent.children.some(c=>c.id!==id&&c.title===source.node.title))return null;\n  for(let p=map.get(parent.id);p;p=p.parent?map.get(p.parent.id):null)if(p.node.id===id)return null;\n  source.parent.children.splice(source.parent.children.indexOf(source.node),1);\n  const at=mode==='inside'?parent.children.length:parent.children.indexOf(target.node)+(mode==='after'?1:0);\n  parent.children.splice(at,0,source.node);\n  return JSON.stringify(next)===JSON.stringify(root)?null:next;\n}\nfunction moveSibling(root,id,delta) {\n  const entry=indexTree(root).get(id);if(!entry?.parent)return null;\n  const siblings=entry.parent.children,at=siblings.findIndex(n=>n.id===id),other=siblings[at+delta];\n  return other?moveNode(root,id,other.id,delta\u003c0?'before':'after'):null;\n}\nfunction outlineText(root) {\n  const lines=[];function walk(n,d){lines.push(`${'  '.repeat(d)}- ${n.title}`);for(const c of n.children)walk(c,d+1);}walk(root,0);return lines.join('\\n');\n}\nfunction parseVisibilityCondition(condition) {\n  if(condition&&typeof condition.fieldId==='string'&&typeof condition.value==='string')return {fieldId:condition.fieldId,value:condition.value};\n  if(condition&&typeof condition.groupId==='string'&&['是','否'].includes(condition.presence))return {groupId:condition.groupId,presence:condition.presence};\n  return null;\n}\nfunction removeNode(root,id) {\n  const next=structuredClone(root),entry=indexTree(next).get(id);if(!entry?.parent)return null;\n  entry.parent.children=entry.parent.children.filter(n=>n.id!==id);return next;\n}\nfunction toTopics(root) {\n  const result=[];\n  function fieldData(n) {\n    const meta=n.meta||{};\n    const f={id:n.id,label:n.title,type:meta.type||'t',fact:meta.fact===true,invertLegacyYes:meta.invertLegacyYes===true};\n    if(typeof meta.unit==='string')f.unit=meta.unit;\n    if(typeof meta.role==='string')f.r <script>
'use strict';
function canContain(parentKind,childKind) {
  return parentKind==='root'?childKind==='group':parentKind==='group'?['group','field'].includes(childKind):parentKind==='field'?childKind==='option':false;
}
function fromTopics(topics) {
  const root={id:'overview',kind:'root',title:'总览',children:[]};
  const categories=[...new Set(topics.map(t=>t.category))];
  for(const [i,category] of categories.entries()) {
    const group={id:`category_${i}`,kind:'group',title:category,children:[]};
    const list=topics.filter(t=>t.category===category);
    for(const topic of list) {
      const branch={id:`topic_${topic.id}`,kind:'group',title:topic.title,meta:{phase:topic.phase,hint:topic.hint,sources:topic.sources},children:[]};
      for(const field of topic.fields) {
        const {label,...meta}=field;
        const node={id:field.id,kind:'field',title:label,meta:{...meta,phase:topic.phase,hint:topic.hint,sources:topic.sources},children:[]};
        const options=field.type==='y'?['是','否']:field.type==='s'?field.options:[];
        node.children=options.map((v,i)=>({id:`${field.id}_option_${i}`,kind:'option',title:v,children:[]}));
        branch.children.push(node);
      }
      if(topic.title===category||list.length===1||topic.fields.length===1)group.children.push(...branch.children);
      else group.children.push(branch);
    }
    root.children.push(group);
  }
  return root;
}
function indexTree(root) {
  const map=new Map();
  function walk(node,parent=null,depth=0){map.set(node.id,{node,parent,depth});for(const child of node.children)walk(child,node,depth+1);}
  walk(root);return map;
}
function moveNode(root,id,targetId,mode='inside') {
  if(!['inside','before','after'].includes(mode))return null;
  const next=structuredClone(root),map=indexTree(next),source=map.get(id),target=map.get(targetId);
  if(!source?.parent||!target||id===targetId)return null;
  const parent=mode==='inside'?target.node:target.parent;
  if(!parent||!canContain(parent.kind,source.node.kind))return null;
  if(source.node.kind==='option'&&parent.children.some(c=>c.id!==id&&c.title===source.node.title))return null;
  for(let p=map.get(parent.id);p;p=p.parent?map.get(p.parent.id):null)if(p.node.id===id)return null;
  source.parent.children.splice(source.parent.children.indexOf(source.node),1);
  const at=mode==='inside'?parent.children.length:parent.children.indexOf(target.node)+(mode==='after'?1:0);
  parent.children.splice(at,0,source.node);

  const entry=indexTree(root).get(id);if(!entry?.parent)return null;
  const siblings=entry.parent.children,at=siblings.findIndex(n=>n.id===id),other=siblings[at+delta];

function outlineText(root) {

  return null;
}

$('canvas').addEventListener('pointermove',e=>{if(!gesture)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(Math.hypot(dx,dy)<6&&!gesture.moved)return;gesture.moved=true;if(!gesture.id){pan={x:gesture.panX+dx,y:gesture.panY+dy};transform();return;}const ghost=$('drag-ghost');ghost.hidden=false;ghost.textContent=entries().get(gesture.id).node.title;ghost.style.left=`${e.clientX+16}px`;ghost.style.top=`${e.clientY+12}px`;clearDrop();const target=document.elementsFromPoint(e.clientX,e.clientY).map(el=>el.closest('[data-node]')).find(el=>el&&el.dataset.node!==gesture.id);if(!target)return;const rect=target.getBoundingClientRect(),rel=(e.clientY-rect.top)/rect.height;const mode=rel<.27?'before':rel>.73?'after':'inside';if(moveNode(tree,gesture.id,target.dataset.node,mode)){drop={targetId:target.dataset.node,mode};target.classList.add(`drop-${mode}`);}});
function endGesture(e){if(!gesture)return;const g=gesture,target=drop;gesture=null;clearDrop();$('drag-ghost').hidden=true;$('canvas').classList.remove('panning');if(g.moved){suppressClick=true;setTimeout(()=>suppressClick=false,0);if(g.id&&target){commit(moveNode(tree,g.id,target.targetId,target.mode),g.id);selectNode(g.id,true);save();}}else if(g.id)selectNode(g.id);if($('canvas').hasPointerCapture(e.pointerId))$('canvas').releasePointerCapture(e.pointerId);}
$('canvas').addEventListener('pointerup',endGesture);$('canvas').addEventListener('pointercancel',e=>{gesture=null;clearDrop();$('drag-ghost').hidden=true;$('canvas').classList.remove('panning');});
$('canvas').addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){const r=$('canvas').getBoundingClientRect();scaleTo(zoom*Math.exp(-e.deltaY*.005),e.clientX-r.left,e.clientY-r.top);}else{pan.x-=e.deltaX;pan.y-=e.deltaY;transform();}},{passive:false});
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('export-open').onclick=()=>$('export-dialog').showModal();$('export-json').onclick=()=>{download(JSON.stringify({version:1,title:tree.title,tree},null,2),'看房脑图备份.json','application/json');notify('脑图备份已导出');};$('export-outline').onclick=()=>download(outlineText(tree),'看房清单大纲.md','text/markdown;charset=utf-8');
$('export-checklist').onclick=()=>{const topics=toTopics(tree);if(!validTopics(topics)){notify('清单中至少需要保留一个检查项');return;}const html=checklistTemplate.replace('data-custom="false"','data-custom="true"').replace('__CHECKLIST_DATA__',JSON.stringify(topics).replaceAll('<','\\u003c'));download(html,'看房清单_调整版.html','text/html;charset=utf-8');notify('已生成调整后的可填写清单');};
$('publish').onclick=async()=>{if(!validTopics(toTopics(tree))){notify('清单中至少需要保留一个检查项');return;}save();try{await sourceClient.publish(tree);notify('已保存到磁盘，看房清单会自动更新');}catch(error){notify(error.message);}};
$('import-json').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('large');const data=JSON.parse(await file.text());if(data.version!==1||!validTree(data.tree))throw Error('invalid');$('export-dialog').close();await historyUI.previewImport(data.tree);}catch{notify('无法导入：请选择有效的脑图 JSON 备份');}e.target.value='';};
sourceClient=createSourceClient(next=>{
 if(JSON.stringify(next)===JSON.stringify(tree))return;
 receivingSource=true;past.push(structuredClone(tree));tree=next;future=[];
 const map=entries();collapsed=new Set([...collapsed].filter(id=>map.has(id)));if(!map.has(selected))selected=tree.id;
 render();fit();save();receivingSource=false;
},(state,message,detail)=>{
 const labels={synced:'已保存到磁盘',saving:'正在保存到磁盘…',local:cacheHealthy?'仅保存在浏览器 · 待保存':'尚未保存 · 请勿关闭',error:cacheHealthy?'仅保存在浏览器 · 自动重试中':'保存失败 · 请勿关闭',conflict:'版本冲突 · 当前稿已保留'};
 $('save-state').textContent=state==='error'&&!detail?.pending?'当前稿已保留 · 保存服务离线':labels[state]||message;
 if(state==='synced'&&detail?.savedAt)$('save-state').textContent+=' · '+new Date(detail.savedAt).toLocaleTimeString('zh-CN');
 const backupFailed=state==='synced'&&detail?.backup?.state==='error';
 $('warning').hidden=!['error','conflict'].includes(state)&&!backupFailed&&cacheHealthy;
 $('warning').textContent=backupFailed?'主稿已保存；第二份备份失败，正在自动重试。':!cacheHealthy?'浏览器缓存无法保存，请确认磁盘保存成功后再关闭。':message||'';
 $('save-retry').hidden=!['local','error'].includes(state);
},undefined,{initialTree:hasSavedBrain?tree:null,fallbackTree:original,sync:syncState,onCheckpoint:state=>{syncState=state;cache();}});
$('save-retry').onclick=()=>sourceClient.retry().catch(()=>{});
historyUI=mountHistory({getTree:()=>tree,client:sourceClient,notify,storageKey:KEY,escapeHTML:esc,outline:outlineText});
window.addEventListener('online',()=>sourceClient.retry().catch(()=>{}));
window.addEventListener('beforeunload',e=>{if(sourceClient.getState().pending){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.key===KEY)sourceClient.refresh();});
window.addEventListener('resize',fit);window.addEventListener('focus',()=>sourceClient.refresh());
render();requestAnimationFrame(fit);sourceClient.refresh();setInterval(()=>{if(!document.hidden)sourceClient.refresh();},3000);
</script></body></html>
