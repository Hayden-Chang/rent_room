tton,.close-panel{display:inline-block}.mobile-button{min-width:44px}.close-panel{border:0;background:#f2f5ef;font-size:13px}.canvas-top{top:12px;left:12px;right:12px}.canvas-bottom{bottom:12px;left:12px;right:12px}.canvas-top button{min-height:40px}.zoom button{min-height:40px;min-width:40px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="app-header"><div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="6" height="6" rx="2"/><path d="M8 12h5M13 5v14M13 5h3M13 19h3"/><rect x="16" y="2" width="6" height="6" rx="2"/><rect x="16" y="16" width="6" height="6" rx="2"/></svg></div><div><h1>看房清单 · 脑图</h1><div class="subtitle">所有分类共用一张大图，改内容、调顺序</div></div></div><div class="header-actions"><span class="save-state" id="save-state" role="status">准备编辑</span><button id="history-open">版本历史</button><button id="save-retry" hidden>重试保存</button><button id="export-open">导出 / 导入</button><button class="primary" id="publish">应用到看房清单</button></div></header>
<nav class="toolbar" aria-label="脑图编辑工具"><button class="mobile-button" id="show-structure">目录</button><button id="undo" aria-label="撤销" title="⌘ / Ctrl + Z">撤销</button><button id="redo" aria-label="重做" title="⌘ / Ctrl + Shift + Z">重做</button><span class="separator"></span><button id="add-sibling">＋ 同级节点</button><button id="add-child">＋ 子节点</button><button id="edit-node">编辑</button><span class="separator"></span><button id="move-up">上移</button><button id="move-down">下移</button><button id="toggle-branch">展开 / 收起</button><span class="hint">双击编辑 · Tab 添加子节点 · Enter 添加同级</span></nav>
<div class="workspace"><aside class="sidebar" id="sidebar" aria-label="清单目录"><div class="side-heading">清单结构 <button class="close-panel" data-panel="sidebar">收起</button></div><div class="search"><input id="node-search" type="search" aria-label="搜索脑图节点" placeholder="搜索检查项或选项"></div><div id="category-list" class="category-list"></div><div class="side-footer" id="map-count"></div></aside>
<main class="canvas-shell" aria-label="脑图画布"><div class="canvas-top"><span class="breadcrumb" id="breadcrumb"></span><div class="map-actions"><button id="expand-all">全部展开</button><button id="category-overview">分类总览</button></div></div><div class="canvas" id="canvas" tabindex="0" aria-label="可编辑脑图，拖动空白平移画布，拖动节点调整结构"><div class="scene" id="scene"><svg class="edges" id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div><div class="canvas-bottom"><span class="canvas-tip">所有分类在同一画布；点目录定位，拖动空白浏览。</span><div class="zoom" aria-label="画布缩放"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit" aria-label="查看全图">全图</button></div><button class="mobile-button" id="show-inspector">属性</button></div></main>
<aside class="inspector" id="inspector" aria-label="节点属性"><div class="inspector-title">节点属性 <button class="close-panel" data-panel="inspector">收起</button></div><small>修改会自动保存，可随时撤销。</small><div id="inspector-content"></div></aside></div>
<dialog id="edit-dialog"><form id="edit-form" class="dialog-inner"><div class="dialog-head"><h2>编辑节点</h2><button type="button" data-close="edit-dialog" aria-label="关闭编辑">×</button></div><label><span>节点名称</span><textarea id="edit-title" rows="2" required maxlength="500"></textarea></label><div class="dialog-actions"><button type="button" data-close="edit-dialog">取消</button><button class="primary" type="submit">保存名称</button></div></form></dialog>
<dialog id="add-dialog"><form id="add-form" class="dialog-inner"><div class="dialog-head"><h2 id="add-heading">添加节点</h2><button type="button" data-close="add-dialog" aria-label="关闭添加">×</button></div><label><span>节点类型</span><select id="add-kind"><option value="group">分类 / 分组</option><option value="field">检查项</option><option value="option">选项</option></select></label><label><span>节点名称</span><input id="add-title" required maxlength="500" placeholder="例如：阳台门锁是否正常"></label><div class="dialog-actions"><button type="button" data-close="add-dialog">取消</button><button class="primary" type="submit">添加节点</button></div></form></dialog>
<dialog id="export-dialog"><div class="dialog-inner"><div class="dialog-head"><h2>导出与导入</h2><button data-close="export-dialog" aria-label="关闭导出">×</button></div><div class="export-list"><button id="export-json">脑图备份 · JSON<small>包含全部节点，可重新导入继续编辑。</small></button><button id="export-outline">文字大纲 · Markdown<small>按当前层级和顺序导出，方便复制与审阅。</small></button><button id="export-checklist">可填写清单 · HTML<small>使用调整后的内容和选项生成看房 checklist。</small></button><button id="import-json">导入脑图备份<small>替换当前脑图，可撤销；看房记录独立保留。</small></button></div><input id="import-file" type="file" accept=".json,application/json" hidden></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><div id="warning" class="warning" hidden></div><div id="drag-ghost" class="drag-ghost" hidden></div>

<script type="application/json" id="checklist-template">__CHECKLIST_TEMPLATE__</script>
<script>
'use strict';
__CORE_FUNCTIONS__
__VALID_TOPICS__
__SOURCE_FUNCTIONS__
__HISTORY_FUNCTIONS__
const $=id=>document.getElementById(id),KEY='rental-checklist-map-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||`map_${Date.now()}_${Math.random().toString(36).slice(2)}`;
const TYPES={root:'总览',group:'分类 / 分组',field:'检查项',option:'选项'};
const FORM_TYPES={y:'是 / 否',s:'单选选项',m:'多选选项',t:'文字填写',n:'数字填写',d:'日期填写'};
let draftId;try{draftId=sessionStorage.getItem(KEY+'-window');if(!draftId){draftId=uid();sessionStorage.setItem(KEY+'-window',draftId);}}catch{draftId=uid();}
const DRAFT_KEY=KEY+'-draft-'+draftId;
let syncState=null,cacheHealthy=true,historyUI=null;
const original=JSON.parse($('initial-tree').textContent),checklistTemplate=JSON.parse($('checklist-template').textContent);
let tree=structuredClone(original),past=[],future=[],collapsed=new Set(),selected=tree.id,positions=new Map(),zoom=1,pan={x:0,y:0},gesture=null,drop=null,addContext=null,timer,blocked=false,suppressClick=false,sourceClient=null,receivingSource=false,hasSavedBrain=false;
function overviewCollapsed(root){return new Set([...indexTree(root).values()].filter(e=>e.node.children.length&&e.parent).map(e=>e.node.id));}
collapsed=overviewCollapsed(tree);
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');const own=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(own?.sync?.pending&&validTree(own.tree))saved=own;if(saved){if(saved.version!==1||!validTree(saved.tree))throw Error('invalid');syncState=saved.sync||null;tree=syncState?.pending&&validTree(syncState.pendingTree)?syncState.pendingTree:saved.tree;hasSavedBrain=true;past=(saved.past||[]).filter(validTree);future=(saved.future||[]).filter(validTree);collapsed=saved.viewRevision===2?new Set(saved.collapsed||[]):overviewCollapsed(tree);selected=saved.viewRevision===2?saved.selected:tree.id;}}catch{blocked=true;$('warning').hidden=false;$('warning').textContent='已有脑图无法读取，旧内容未覆盖。当前编辑请先导出 JSON 备份。';}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600);}
function cache(){
 if(blocked)return false;
 const snapshot={version:1,tree,past:past.slice(-6),future:future.slice(-2),collapsed:[...collapsed],viewRevision:2,selected,sync:syncState,updatedAt:new Date().toISOString()};
 let stored=false;
 try{localStorage.setItem(DRAFT_KEY,JSON.stringify({...snapshot,past:past.slice(-1),future:[]}));stored=true;}catch{}
 try{localStorage.setItem(KEY,JSON.stringify(snapshot));stored=true;}catch{}
 cacheHealthy=stored;return stored;
}
function save(){if(blocked)return;cache();if(sourceClient&&!receivingSource)sourceClient.save(tree).catch(()=>{});}

function entries(){return indexTree(tree);}
function current(){return entries().get(selected)?.node||tree;}
function pathFor(id){const map=entries(),parts=[];for(let e=map.get(id);e;e=e.parent?map.get(e.parent.id):null)parts.unshift(e.node.title);return parts;}
function containsNode(ancestorId,id){const map=entries();for(let e=map.get(id);e;e=e.parent?map.get(e.parent.id):null)if(e.node.id===ancestorId)return true;return false;}
function reconcile(root){for(const {node} of indexTree(root).values())if(node.kind==='field'){node.meta||={type:'t'};if(node.meta.type==='y'&&(node.children.length!==2||!node.children.some(c=>c.title==='是')||!node.children.some(c=>c.title==='否')))node.meta.type=node.children.length?'s':'t';if(node.children.length&&['t','n','d'].includes(node.meta.type))node.meta.type='s';}}
function commit(next,keepSelection=selected){if(!next||!validTree(next))return false;reconcile(next);if(JSON.stringify(next)===JSON.stringify(tree))return false;past.push(structuredClone(tree));if(past.length>40)past.shift();tree=next;future=[];selected=keepSelection;const map=entries();if(!map.has(selected))selected=tree.id;render();save();return true;}
function undo(){if(!past.length)return;future.push(structuredClone(tree));tree=past.pop();selected=entries().has(selected)?selected:tree.id;render();save();notify('已撤销');}
function redo(){if(!future.length)return;past.push(structuredClone(tree));tree=future.pop();selected=entries().has(selected)?selected:tree.id;render();save();notify('已重做');}
function countFields(node){let n=node.kind==='field'?1:0;for(const c of node.children)n+=countFields(c);return n;}
function selectNode(id,locate=false){const map=entries(),e=map.get(id);if(!e)return;selected=id;if(locate)for(let p=e;p;p=p.parent?map.get(p.parent.id):null)collapsed.delete(p.node.id);render();if(locate)focusNode(id);}
function locateCategory(id){$('sidebar').classList.remove('open');if(id)selectNode(id,true);else{selected=tree.id;collapsed.delete(tree.id);render();fit();}save();}
function categoryOverview(){$('node-search').value='';collapsed=overviewCollapsed(tree);selected=tree.id;render();fit();save();}
function renderSidebar(){const q=$('node-search').value.trim().toLowerCase();let html=`<button class="category root${selected===tree.id?' active':''}" data-category=""><span>${esc(tree.title)}</span><small>${countFields(tree)} 项</small></button>`;

function renderGraph(){positions=treeLayout(tree,collapsed);const map=entries();let edges='',nodes='';for(const [id,p] of positions){const {node:n,parent}=map.get(id),pp=parent&&positions.get(parent.id);if(pp){const left=p.side==='left',x=left?pp.x:pp.x+pp.width,y=pp.y+26,tx=left?p.x+p.width:p.x,ty=p.y+26,d=left?-38:38;edges+=`<path class="edge" d="M${x},${y} C${x+d},${y} ${tx-d},${ty} ${tx},${ty}"/>`;}

function renderInspector(){const n=current(),map=entries(),e=map.get(n.id),siblings=e.parent?.children||[],at=siblings.findIndex(x=>x.id===n.id);const binary=n.meta?.type==='y';
$('inspector-content').innerHTML=`<form id="properties-form"><span class="kind-label">${esc(TYPES[n.kind])}</span><div class="path">${esc(pathFor(n.id).slice(0,-1).join(' / '))}</div><label><span>节点名称</span><textarea class="title" id="node-title" required maxlength="500">${esc(n.title)}</textarea></label>${n.kind==='group'?n.meta?.inspection?.permissionFieldId?`<p class="help-copy">由「${esc(map.get(n.meta.inspection.permissionFieldId)?.node.title||'许可选项')}」控制展开：允许时显示下方检查项，不允许时隐藏。</p>`:`<label class="check"><input type="checkbox" id="group-presence"${n.meta?.inspection?.presence?' checked':''}>先确认有无，选“是”后展开检查</label><label class="check"><input type="checkbox" id="group-aggregate"${n.meta?.inspection?.aggregate?' checked':''}>总正常选项 / 全部正常 / 收起详情</label>`:''}${n.kind==='group'?`<label class="check"><input type="checkbox" id="group-skippable"${n.meta?.inspection?.skippable?' checked':''}>允许标记“不涉及”</label>`:''}${n.kind==='field'?`<label><span>填写方式</span><select id="field-type">${Object.entries(FORM_TYPES).map(([k,v])=>`<option value="${k}"${(n.meta?.type==='s'&&n.meta?.multiple?'m':n.meta?.type)===k?' selected':''}>${v}</option>`).join('')}</select></label><label id="options-label"${n.meta?.type==='s'?'':' hidden'}><span>选项内容（每行一个，按顺序）</span><textarea id="field-options" maxlength="10000">${esc(n.children.map(c=>c.title).join('\n'))}</textarea></label><label class="check" id="fact-label"${binary?'':' hidden'}><input type="checkbox" id="field-fact"${n.meta?.fact?' checked':''}>这是房源属性，选“否”不计为问题</label>`:''}${n.meta?.visibleWhen?`<p class="help-copy">显示条件：${esc(map.get(n.meta.visibleWhen.fieldId||n.meta.visibleWhen.groupId)?.node.title||'关联项目')}选择“${esc(n.meta.visibleWhen.fieldId?n.meta.visibleWhen.value:n.meta.visibleWhen.presence==='否'?'没有':'有')}”时显示</p>`:''}<button class="primary apply" type="submit">保存修改</button></form><div class="inspector-actions"><h3>调整顺序</h3><div class="button-pair"><button data-move="-1"${!e.parent||at===0?' disabled':''}>上移一位</button><button data-mo $('add-sibling').disabled=!e.parent;$('add-child').disabled=n.kind==='option';$('move-up').disabled=!e.parent||at===0;$('move-down').disabled=!e.parent||at===siblings.length-1;$('toggle-branch').disabled=!n.children.length;}
function render(){if(!entries().has(selected))selected=tree.id;renderSidebar();renderGraph();renderInspector();$('undo').disabled=!past.length;$('redo').disabled=!future.length;}
function transform(){$('scene').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;$('zoom-level').textContent=`${zoom<.1?(zoom*100).toFixed(1):Math.round(zoom*100)}%`;}
function fit(){if(!positions.size)return;const ps=[...positions.values()],minX=Math.min(...ps.map(p=>p.x)),minY=Math.min(...ps.map(p=>p.y)),maxX=Math.max(...ps.map(p=>p.x+p.width)),maxY=Math.max(...ps.map(p=>p.y+p.height));const rect=$('canvas').getBoundingClientRect(),w=maxX-minX,h=maxY-minY;zoom=Math.max(.008,Math.min(1.08,(rect.width-55)/Math.max(w,1),(rect.height-115)/Math.max(h,1)));pan={x:(rect.width-w*zoom)/2-minX*zoom,y:60+(rect.height-115-h*zoom)/2-minY*zoom};transform();}
function focusNode(id){if(id===tree.id){fit();return;}const map=entries(),e=map.get(id),p=positions.get(id);if(!p)return;const ps=[p,...e.node.children.map(c=>positions.get(c.id)).filter(Boolean)],minX=Math.min(...ps.map(p=>p.x)),minY=Math.min(...ps.map(p=>p.y)),maxX=Math.max(...ps.map(p=>p.x+p.width)),maxY=Math.max(...ps.map(p=>p.y+p.height)),rect=$('canvas').getBoundingClientRect();zoom=Math.max(.45,Math.min(1,(rect.width-70)/(maxX-minX),(rect.height-125)/(maxY-minY)));pan={x:rect.width/2-(minX+maxX)*zoom/2,y:60+(rect.height-125)/2-(minY+maxY)*zoom/2};transform();}
function scaleTo(next,x=$('canvas').clientWidth/2,y=$('canvas').clientHeight/2){next=Math.max(.008,Math.min(2,next));pan={x:x-(x-pan.x)*next/zoom,y:y-(y-pan.y)*next/zoom};zoom=next;transform();}
function toggle(id){const before=positions.get(id);collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderGraph();const after=positions.get(id);if(before&&after){pan.x+=(before.x-after.x)*zoom;pan.y+=(before.y-after.y)*zoom;transform();}save();}
function openEdit(){$('edit-title').value=current().title;$('edit-dialog').showModal();$('edit-title').focus();$('edit-title').select();}
function openAdd(mode){const e=entries().get(selected),parent=mode==='child'?e.node:e.parent;if(!parent||parent.kind==='option')return;const kinds=['group','field','option'].filter(k=>canContain(parent.kind,k));const kind=mode==='sibling'?e.node.kind:kinds.includes('field')?'field':kinds[0];addContext={parentId:parent.id,after:mode==='sibling'?e.node.id:null};$('add-heading').textContent=mode==='child'?'添加子节点':'添加同级节点';$('add-kind').innerHTML=kinds.map(k=>`<option value="${k}"${k===kind?' selected':''}>${esc(TYPES[k])}</option>`).join('');$('add-title').value='';$('add-dialog').showModal();$('add-title').focus();}
function editTitle(title){title=title.trim();if(!title)return false;const next=structuredClone(tree),e=indexTree(next).get(selected);if(e.node.kind==='option'&&e.parent.children.some(c=>c.id!==selected&&c.title===title)){notify('同一检查项的选项名称不能重复');return false;}e.node.title=title;commit(next);return true;}

document.addEventListener('submit',e=>{if(e.target.id!=='properties-form')return;e.preventDefault();const title=$('node-title').value.trim();if(!title)return;const next=structuredClone(tree),entry=indexTree(next).get(selected),n=entry.node;if(n.kind==='option'&&entry.parent.children.some(c=>c.id!==n.id&&c.title===title)){notify('选项名称不能重复');return;}n.title=title;if(n.kind==='group'){const inspection={...(n.meta?.inspection||{}),skippable:$('group-skippable').checked};if(!inspection.permissionFieldId){inspection.presence=$('group-presence').checked;inspection.aggregate=$('group-aggregate').checked;}n.meta={...n.meta,inspection};}if(n.kind==='field'){const formType=$('field-type').value,type=formType==='m'?'s':formType;n.meta={...(n.meta||{}),type};if(formType==='m')n.meta.multiple=true;else delete n.meta.multiple;if(type==='y'){n.meta.fact=$('field-fact').checked;n.children=(n.children.length===2&&n.children.some(c=>c.title==='是')&&n.children.some(c=>c.title==='否')?n.children.map(c=>c.title):['是','否']).map((s,i)=>({id:n.children.find(c=>c.title===s)?.id||`${n.id}_option_${uid()}`,kind:'option',title:s,children:[]}));}else if(type==='s'){const opts=$('field-options').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!opts.length||new Set(opts).size!==opts.length){notify('请填写至少一个选项，选项名称不能重复');return;}n.children=opts.map(s=>({id:n.children.find(c=>c.title===s)?.id||`${n.id}_option_${uid()}`,kind:'option',title:s,children:[]}));}else n.children=[];}commit(next);notify('修改已记录，保存状态见右上角');});

document.addEventListener('click',e=>{if(suppressClick)return;const b=e.target.closest('button');if(b?.dataset.close){$(b.dataset.close).close();return;}if(b?.dataset.panel){$(b.dataset.panel).classList.remove('open');return;}if(b?.dataset.category!==undefined){locateCategory(b.dataset.category||null);return;}if(b?.dataset.locate){selectNode(b.dataset.locate,true);$('sidebar').classList.remove('open');return;}if(b?.dataset.fold){toggle(b.dataset.fold);return;}if(b?.dataset.move){commit(moveSibling(tree,selected,Number(b.dataset.move)));return;}if(b?.id==='change-parent'){const target=$('parent-choice').value;if(target===entries().get(selected).parent?.id)return;const next=moveNode(tree,selected,target);if(next){commit(next);selectNode(selected,true);save();}return;}if(b?.id==='delete-node'){const parent=entries().get(selected).parent;commit(removeNode(tree,selected),parent?.id);notify('已删除，可撤销恢复');return;}const n=e.target.closest('[data-node]');if(n)selectNode(n.dataset.node);});

$('undo').onclick=undo;$('redo').onclick=redo;$('add-sibling').onclick=()=>openAdd('sibling');$('add-child').onclick=()=>openAdd('child');$('edit-node').onclick=openEdit;$('move-up').onclick=()=>commit(moveSibling(tree,selected,-1));$('move-down').onclick=()=>commit(moveSibling(tree,selected,1));$('toggle-branch').onclick=()=>toggle(selected);

document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||document.querySelector('dialog[open]'))return;const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();commit(moveSibling(tree,selected,e.key==='ArrowUp'?-1:1));return;}if(!e.target.closest('#canvas'))return;if(e.key==='Tab'&&current().kind!=='option'){e.preventDefault();openAdd('child');}else if(e.key==='Enter'){e.preventDefault();openAdd('sibling');}else if(e.key==='F2'||e.key===' '){e.preventDefault();openEdit();}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();const parent=entries().get(selected).parent;if(parent)commit(removeNode(tree,selected),parent.id);}else if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const e1=entries().get(selected),list=e1.parent?.children||[],at=list.findIndex(n=>n.id===selected),other=list[at+(e.key==='ArrowUp'?-1:1)];if(other)selectNode(other.id);}else if(e.key==='ArrowLeft'){const parent=entries().get(selected).parent;if(parent){e.preventDefault();selectNode(parent.id);}}else if(e.key==='ArrowRight'&&current().children.length){e.preventDefault();collapsed.delete(selected);selectNode(current().children[0].id);} });
function clearDrop(){document.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(el=>el.classList.remove('drop-before','drop-after','drop-inside'));drop=null;}
$('canvas').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-fold]'))return;const node=e.target.closest('[data-node]');gesture={id:node?.dataset.node,startX:e.clientX,startY:e.clientY,panX:pan.x,panY:pan.y,moved:false};$('canvas').setPointerCapture(e.pointerId);if(!node)$('canvas').classList.add('panning');});
$('canvas').addEventListener('pointermove',e=>{if(!gesture)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(Math.hypot(dx,dy)<6&&!gesture.moved)return;gesture.moved=true;if(!gesture.id){pan={x:gesture.panX+dx,y:gesture.panY+dy};transform();return;}const ghost=$('drag-ghost');ghost.hidden=false;ghost.textContent=entries().get(gesture.id).node.title;ghost.style.left=`${e.clientX+16}px`;ghost.style.top=`${e.clientY+12}px`;clearDrop();const target=document.elementsFromPoint(e.clientX,e.clientY).map(el=>el.closest('[data-node]')).find(el=>el&&el.dataset.node!==gesture.id);if(!target)return;const rect=target.getBoundingClientRect(),rel=(e.clientY-rect.top)/rect.height;const mode=rel<.27?'before':rel>.73?'after':'inside';if(moveNode(tree,gesture.id,target.dataset.node,mode)){drop={targetId:target.dataset.node,mode};target.classList.add(`drop-${mode}`);}});

$('export-open').onclick=()=>$('export-dialog').showModal();$('export-json').onclick=()=>{download(JSON.stringify({version:1,title:tree.title,tree},null,2),'看房脑图备份.json','application/json');notify('脑图备份已导出');};$('export-outline').onclick=()=>download(outlineText(tree),'看房清单大纲.md','text/markdown;charset=utf-8');

},(state,message,detail)=>{

},undefined,{initialTree:hasSavedBrain?tree:null,fallbackTree:original,sync:syncState,onCheckpoint:state=>{syncState=state;cache();}});
