.topic{padding-bottom:4px}.inspection{padding:8px 0}.inspection .inspection{border-left:0;padding-left:12px}.group-content{padding-top:4px}

.phase-pills button[aria-pressed=true]{background:var(--soft)}

.directory-list .category-status{flex-basis:18px}.directory-list .category-status svg{width:17px;height:17px}.directory-copy{flex:1;min-width:0}.directory-name{display:block;font-size:13px;font-weight:500}.directory-progress{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:400;margin-top:3px;color:var(--muted)}
.directory-list .category-chevron{width:14px;height:14px}.directory-list .section-count,.directory-list .category-issues{font-size:11px}
@media(max-width:600px){.property{padding:0 0 16px;margin-top:14px;margin-bottom:10px}.section-toggle{min-height:68px;gap:9px;padding:12px 0}.section-name{font-size:17px}.category-summary{gap:6px}.section-content{padding:0 0 8px 0}.section-count{font-size:12px}.category-status{flex-basis:20px}.field{padding:6px 0}.directory-name{font-size:15px}.directory-list a{min-height:64px}}
@media print{.section-toggle{display:flex!important}.section-content[hidden]{display:block!important}.category-chevron{display:none}.section{border:0;border-bottom:1px solid #ddd}}
</style>

<script>
'use strict';
__CORE_FUNCTIONS__
__SOURCE_FUNCTIONS__
let TOPICS=JSON.parse(document.getElementById('checklist-data').textContent);
__MODEL_FUNCTIONS__
let localBrain=null;
try{const savedMap=JSON.parse(localStorage.getItem('rental-checklist-map-v1')||'null');if(savedMap?.version===1&&validTree(savedMap.tree))localBrain=savedMap.tree;TOPICS=resolveTopics(TOPICS,savedMap,JSON.parse(localStorage.getItem('rental-checklist-schema-v1')||'null'),document.getElementById('checklist-data').dataset.custom==='true');}catch{}
TOPICS=prepareTopics(TOPICS);
const KEY='rental-checklist-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||`r${Date.now()}_${Math.random().toString(36).slice(2)}`;
const fresh=name=>({id:uid(),name,address:'',decision:'',summary:'',answers:{},extras:[],checklistRevision:2});
let blocked=false,storageError='',data,view='check',phase='all',filter='all',query='',editId=null,toastTimer;
function validHouse(h){return h&&typeof h.id==='string'&&typeof h.name==='string'&&h.answers&&typeof h.answers==='object'&&!Array.isArray(h.answers)&&Array.isArray(h.extras)&&h.extras.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.category==='string'&&Array.isArray(t.fields)&&t.fields.length>0&&t.fields.every(f=>f&&typeof f.id==='string'&&typeof f.label==='string'&&['c','t','n','y','a','d','s'].includes(f.type)&&(!f.options||Array.isArray(f.options))));}
try{const stored=localStorage.getItem(KEY);if(stored){data=JSON.parse(stored);if(data.version!==1||!Array.isArray(data.houses)||!data.houses.length||!data.houses.every(validHouse))throw Error('invalid');}}catch(e){blocked=true;storageError='已有记录无法读取，或浏览器不允许保存。旧记录未覆盖；本次内容可通过“备份全部房源”导出。';data=null;}
if(!data){const h=fresh('待看房源');data={version:1,current:h.id,houses:[h]};}
const needsMigration=data.houses.some(h=>h.checklistRevision!==2||needsResultMigration(h,TOPICS));
data.profile||={workplace:"",mode:"transit",city:""};
data.houses.forEach(h=>migrateBehavior(normalizeHouse(h,TOPICS),TOPICS));
if(!data.houses.some(h=>h.id===data.current))data.current=data.houses[0].id;
const house=()=>data.houses.find(h=>h.id===data.current);
const allTopics=()=>[...TOPICS,...house().extras];
const groups=()=>inspectionGroups(allTopics());
const allFields=()=>{
 const topics=allTopics(),h=house(),list=topics.filter(t=>topicActive(t,h)).flatMap(t=>t.fields.filter(f=>fieldActive(f,h)&&!isPermissionController(t,f)).map(f=>({topic:t,field:f})));
 for(const g of groups().values()){
  const t=g.topics.find(t=>topicAvailable(t,h));if(!t)continue;const at=t.path.findIndex(p=>p.id===g.id),ancestors=t.path.slice(0,at);
  if(!ancestors.every(p=>groupAllowsDetails(p,h)))continue;
  if(groupSkipped(g,h)){list.push({topic:t,field:{id:`not_applicable_${g.id}`,label:g.title,type:"s",options:["不涉及"],fact:true,groupId:g.id,groupRole:"notApplicable"}});continue;}
  if(g.permissionFieldId){const f=g.fields.find(f=>f.id===g.permissionFieldId);if(f)list.push({topic:t,field:{...f,groupId:g.id,groupRole:'permission'}});continue;}
  if(g.presence)list.push({topic:t,field:{id:`presence_${g.id}`,label:`有${g.title}`,type:'y',fact:true,groupId:g.id,groupRole:'presence'}});
  if((!g.presence||groupAnswer(h,g.id).presence==='是')&&groupAnswer(h,g.id).normal==='否'&&!groupFields(g,h).some(f=>isProblem(f,h.answers[f.id])))list.push({topic:t,field:{id:`normal_${g.id}`,label:`${g.title}正常`,type:'y',badValue:'否',groupId:g.id,groupRole:'normal'}});
 }
 return list;
};
const answer=f=>{if(f.groupRole==='notApplicable')return {value:groupAnswer(house(),f.groupId).notApplicable?'不涉及':''};if(f.groupRole&&f.groupRole!=='permission')return {value:groupAnswer(house(),f.groupId)[f.groupRole]||''};const a=house().answers[f.id];return a&&typeof a==='object'?a:{};};
const value=f=>fieldValue(f,answer(f));
const recorded=f=>fieldRecorded(f,answer(f));
const problem=f=>isProblem(f,answer(f));
function warn(message){$('storage-warning').hidden=false;$('storage-warning').textContent=message;}
function persist(){if(blocked){$('save-state').textContent='未自动保存，请导出备份';warn(storageError);return;}try{data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));$('save-state').textContent='已保存到当前浏览器';$('storage-warning').hidden=true;}catch(e){storageError='浏览器未能保存，请先导出备份，当前页面仍可继续填写。';warn(storageError);$('save-state').textContent='保存失败，请导出备份';}}
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function updateStats(){const fields=allFields();const n=fields.filter(x=>recorded(x.field)).length;const issues=fields.filter(x=>problem(x.field)).length;$('recorded').textContent=n;$('total').textContent=fields.length;$('empty-count').textContent=fields.length-n;$('progress').style.width=`${fields.length?n/fields.length*100:0}%`;$('issues-count').textContent=issues;$('issues-count').closest('.stat').classList.toggle('has-issues',issues>0);$('progress').parentElement.setAttribute('aria-valuenow',Math.round(fields.length?n/fields.length*100:0));$('progress').parentElement.setAttribute('aria-valuetext',`已记录 ${n} 项，共 ${fields.length} 项`);$('nav-issue-count').textContent=issues;$('nav-issue-count').hidden=issues===0;updateCategoryStats(fields);}
function categoryStatusMarkup(cat){return `<span class="category-status" data-category-state="${esc(cat)}" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle class="status-dot" cx="12" cy="12" r="3"></circle><path class="status-check" d="m7.5 12 3 3 6-6"></path></svg></span>`;}
function categoryIssuesMarkup(cat){return `<span class="category-issues" data-category-issues="${esc(cat)}" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6m0 4v.1"></path></svg><span></span></span>`;}
function updateCategoryStats(fields){
 const totals=new Map();
 for(const x of fields){const key=x.topic.category,v=totals.get(key)||{total:0,done:0,issues:0};v.total++;if(recorded(x.field))v.done++;if(problem(x.field))v.issues++;totals.set(key,v);}
 const summary=cat=>totals.get(cat)||{total:0,done:0,issues:0};
 document.querySelectorAll('[data-section-count]').forEach(el=>{const v=summary(el.dataset.sectionCount);el.textContent=`${v.done} / ${v.total}`;el.setAttribute('aria-label',`已记录 ${v.done} 项，共 ${v.total} 项`);});
 document.querySelectorAll('[data-category-state]').forEach(el=>{const v=summary(el.dataset.categoryState);el.dataset.state=v.total&&v.done===v.total?'complete':v.done?'partial':'empty';el.title=v.total&&v.done===v.total?'已全部记录':v.done?'检查中':'尚未检查';});
 document.querySelectorAll('[data-category-issues]').forEach(el=>{const v=summary(el.dataset.categoryIssues);el.hidden=v.issues===0;el.querySelector('span').textContent=v.issues;el.setAttribute('aria-label',`${v.issues} 项有问题`);});
}
// Disclosure is presentation state only; opening or closing never edits answers.
const categoryExpansion=new Map();
const categoryKey=cat=>JSON.stringify([house().id,view,phase,filter,query,cat]);
const categoryExpanded=cat=>categoryExpansion.get(categoryKey(cat))??(!!query||view==='issues'||filter!=='all');
function setCategoryExpanded(section,expanded){
 categoryExpansion.set(categoryKey(section.dataset.category),expanded);
 section.querySelector('.section-toggle').setAttribute('aria-expanded',String(expanded));
 section.querySelector('.section-content').hidden=!expanded;
}
function updateHouseHeader(){$('house-switch').innerHTML=data.houses.map(h=>`<option value="${esc(h.id)}"${h.id===data.current?' selected':''}>${esc(h.address||h.name)}</option>`).join('');$('property-address').textContent=house().address||'先填写地址，方便区分不同房源';}
let commuteBusy=new Set(),commuteMessages={};
function renderField(f){const a=answer(f),val=value(f),options=choiceOptions(f),choice=options.length>0,binary=(f.type!=='s'||isInspectionResult(f))&&choice,compact=!binary&&compactChoices(f),inline=binary||compact;let control='';if(choice){control=`<div class="choices${inline?' binary':''}${isInspectionResult(f)||compact?' result-control':''}" role="group" aria-label="${esc(f.label)}">${options.map(v=>{const selected=choiceSelected(f,a,v),button=`<button type="button" data-action="choose" data-id="${esc(f.id)}" data-value="${esc(v)}" aria-pressed="${selected}">${esc(v)}</button>`;return v.trim()==='其他'?`<span class="choice-other${selected?' active':''}">${button}<input class="choice-other-input" id="other-${esc(f.id)}" data-id="${esc(f.id)}" data-prop="otherText" type="text" aria-label="${esc(f.label)}：其他内容" maxlength="2000" placeholder="请填写其他内容" value="${esc(a.otherText??'')}"${selected?'':' hidden'}></span>`:button;}).join('')}</div>`;}else{control=`<input class="input-control" id="input-${esc(f.id)}" data-id="${esc(f.id)}" data-prop="value" type="${f.type==='n'?'number':f.type==='d'?'date':'text'}"${f.type==='n'?' min="0" step="any" inputmode="decimal"':''} value="${esc(val)}" maxlength="2000" placeholder="${f.type==='n'?'填写数值':f.type==='d'?'':'填写信息'}">`;}
if(!binary&&!f.fact)control=`<div class="field-response">${control}<button type="button" class="field-flag" data-action="flag" data-id="${esc(f.id)}" aria-label="标记问题：${esc(f.label)}" title="${a.problem?'取消问题标记':'标记问题'}" aria-pressed="${a.problem===true}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg></button></div>`;
return `<div class="field${problem(f)?' bad':''}${f.fact?' fact':''}${choice&&!inline?' choice-many':''}${compact?' choice-compact':''}${otherChoiceSelected(f,a)?' has-other-input':''}" id="row-${esc(f.id)}" data-field="${esc(f.id)}"><div class="field-main"><label class="field-label"${!choice?` for="input-${esc(f.id)}"`:''}>${esc(f.label)}${f.multiple?'<small class="multi-hint">可多选</small>':''}</label>${control}</div>${choice&&val&&!recorded(f)?`<p class="topic-hint">原记录：${esc(val)}。选项已调整，请重新选择。</p>`:''}${f.role==='commute'?renderCommute(f):''}</div>`;}
function matches(t,f){if(!fieldActive(f,house()))return false;if(query&&!`${t.title} ${t.category} ${f.label} ${answer(f).note||''} ${fieldDisplayValue(f,answer(f))}`.toLowerCase().includes(query.toLowerCase()))return false;if(view==='issues')return problem(f);if(filter==='empty')return !recorded(f);if(filter==='done')return recorded(f);return true;}
function render(){updateHouseHeader();updateStats();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));const conclusion=view==='conclusion';document.querySelector('.directory').hidden=conclusion;document.querySelector('.workspace').classList.toggle('without-directory',conclusion);$('search').closest('.toolbar').hidden=conclusion;$('phases').hidden=conclusion||view==='issues';$('add-item').hidden=conclusion;

async function calculateCommute(fieldId,explicit=false){
 const h=house(),signature=commuteSignature(h);if(commuteBusy.has(h.id))return;
 if(!data.profile.workplace||!h.address){notify('请先填写房源地址和上班地点');return;}
 if(!explicit&&(h.commute?.signature===signature||h.commute?.source==='manual'))return;
 const before=String(h.answers[fieldId]?.value||'');commuteBusy.add(h.id);commuteMessages[h.id]='正在计算预计耗时…';render();
 try{const r=await fetch('/api/commute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:h.address,destination:data.profile.workplace,mode:data.profile.mode,city:data.profile.city}),signal:AbortSignal.timeout(20000)});const result=await r.json();if(!r.ok)throw Error(result.error||'自动计算暂不可用，请手动填写');
  if(!Number.isFinite(result.minutes)||result.minutes<0)throw Error('未取得有效耗时，请手动填写');
  if(commuteSignature(h)!==signature||String(h.answers[fieldId]?.value||'')!==before){commuteMessages[h.id]='信息已修改，本次计算结果未覆盖你的输入。';return;}
  h.answers[fieldId]={...(h.answers[fieldId]||{}),value:String(result.minutes)};h.commute={source:'amap',signature,calculatedAt:new Date().toISOString()};commuteMessages[h.id]='高德预计耗时 · 可手动修改';persist();
 }catch(err){commuteMessages[h.id]=String(err.message).includes('JSON')?'自动计算需要本地服务，请手动填写。':err.name==='TimeoutError'?'计算超时，请重试或手动填写。':err.message;}
 finally{commuteBusy.delete(h.id);if(h.id===data.current)render();}
}
